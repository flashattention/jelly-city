# main 브랜치에 push 하면: 검사 → Fly.io 실서버에 자동 배포
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 패치노트 검사
        run: node tools/patchnotes.mjs --check
      - name: 문법 검사
        run: for f in server/*.js server/*/*.js public/*/js/*.js public/hub/*.js; do node --check "$f" || exit 1; done
      - name: 서버 기동 테스트
        run: |
          PORT=8123 DATA_DIR=/tmp/rc node server/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8123/healthz && break; sleep 1; done
          curl -sf localhost:8123/api/status
          curl -sf localhost:8123/ > /dev/null
          curl -sf localhost:8123/shared/patchnotes.json > /dev/null
          curl -sf localhost:8123/api/board/list > /dev/null
          curl -sf localhost:8123/privacy.html > /dev/null
          curl -sf localhost:8123/jelly-city/ > /dev/null
          curl -sf localhost:8123/dream-runner/ > /dev/null
          curl -sf localhost:8123/jelly-drift/ > /dev/null
          curl -sf localhost:8123/jelly-tactical/ > /dev/null
          curl -sf localhost:8123/jelly-drop/ > /dev/null
          curl -sf localhost:8123/jelly-guard/ > /dev/null
          curl -sf localhost:8123/jelly-ten/ > /dev/null
          curl -sf localhost:8123/jelly-word/ > /dev/null
          curl -sf localhost:8123/jelly-draw/ > /dev/null
          curl -sf localhost:8123/jelly-type/ > /dev/null
          curl -sf localhost:8123/jelly-survivor/ > /dev/null
          curl -sf localhost:8123/jelly-sketch/ > /dev/null
          curl -sf localhost:8123/jelly-rumble/ > /dev/null
          curl -sf localhost:8123/jelly-merge/ > /dev/null
          curl -sf localhost:8123/jelly-court/ > /dev/null
          curl -sf localhost:8123/jelly-ding/ > /dev/null
          curl -sf localhost:8123/jelly-slide/ > /dev/null
          curl -sf localhost:8123/jelly-hide/ > /dev/null
          curl -sf localhost:8123/jelly-arena/ > /dev/null
          curl -sf 'localhost:8123/api/surv/board?b=normal' > /dev/null
          curl -sf 'localhost:8123/api/ten/board?b=t120' > /dev/null
          # 이름이 바뀐 게임: 옛 주소가 새 주소로 넘어가는지
          for o in jelly-bg jelly-attack/bg jelly-watch jelly-rider jelly-attack jelly-guys jelly-bang jelly-apple; do curl -sfL localhost:8123/$o/ > /dev/null; done
          curl -sf 'localhost:8123/api/merge/board?b=box' > /dev/null
          curl -sf 'localhost:8123/api/slide/board?b=s4' > /dev/null
          curl -sf 'localhost:8123/api/apple/board?b=t120' > /dev/null
          curl -sf localhost:8123/api/dream/board

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 패치노트를 커밋 기록에서 만든다
      - name: 패치노트에 새 커밋 추가
        run: node tools/patchnotes.mjs && node tools/patchnotes.mjs --check
      # flyctl: GitHub 릴리스 내려받기가 504 로 자주 실패해서(2026-11-08), 공식 Docker 이미지(Docker Hub)로 배포한다.
      #   빌드는 Fly 원격 빌더가 하므로(--remote-only) 이미지 안에서 flyctl 만 돌리면 된다. 3번까지 다시 시도, 끝내 실패하면 실패로 끝낸다
      - name: 배포 (flyctl Docker 이미지 · 다시 시도)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for i in 1 2 3; do
            docker run --rm -e FLY_API_TOKEN -v "$PWD:/app" -w /app flyio/flyctl:latest deploy --remote-only && exit 0
            echo "다시 시도 $i"; sleep 30
          done
          exit 1
