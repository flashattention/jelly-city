# 매일 00:17 (KST): 실서버 데이터에서 운영 지표(docs/metrics.md)를 다시 뽑아 main 에 커밋한다
#   서버 데이터 파일은 받기만 하고 커밋하지 않는다 (합계 숫자만 문서로). 이 커밋은 배포를 다시 하지 않는다 (GITHUB_TOKEN 푸시 · [skip ci])
name: metrics

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 서버 데이터 받기 (flyctl Docker 이미지 · 다시 시도)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          FILES="world.json dream-runner.json dream-runner-toss.json cosmetics.json board.json playtime.json jelly-drift.json jelly-merge.json jelly-slide.json jelly-survivor.json jelly-ten.json jelly-type.json seoul-walk-metrics"
          for i in 1 2 3; do
            docker run --rm -e FLY_API_TOKEN flyio/flyctl:latest ssh console -a jelly-city -q -C "sh -c 'cd /data && tar czf - $FILES 2>/dev/null | base64 -w0; true'" > "$RUNNER_TEMP/data.b64" && [ -s "$RUNNER_TEMP/data.b64" ] && break
            echo "다시 시도 $i"; sleep 20
          done
          tr -d '\r\n ' < "$RUNNER_TEMP/data.b64" | base64 -d | tar xzf - -C "$RUNNER_TEMP/data"
          ls -la "$RUNNER_TEMP/data"
      - name: 지표 뽑기
        run: node tools/metrics.mjs "$RUNNER_TEMP/data" > docs/metrics.md
      - name: 바뀌었으면 커밋 · 푸시
        run: |
          if git diff --quiet -- docs/metrics.md; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics.md
          git commit -m "[노트없음] 운영 지표 매일 갱신 ($(TZ=Asia/Seoul date +%F)) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
