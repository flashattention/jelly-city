if (q.get('cnt')) { const t = {}; for (const c of hg.chunks.values()) c.scene.traverseVisible((o) => { if (!o.isMesh || o.isInstancedMesh) return; const g = o.geometry, mm = o.material, b = g.boundingBox || (g.computeBoundingBox(), g.boundingBox), sz = Math.round(Math.max(b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z)), k = (mm?.type || '') + (mm?.map ? '+map' : '') + (mm?.color ? mm.color.getHexString() : '') + ':' + g.type + ':' + (g.index ? g.index.count / 3 : g.attributes.position.count / 3) + ':sz' + (sz > 50 ? 'big' : sz) + (o.userData.noMerge ? ':nm' : '') + (o.userData.noDrape ? ':nd' : ''); t[k] = (t[k] || 0) + 1; }); document.getElementById('log').textContent = Object.entries(t).sort((a, b) => b[1] - a[1]).slice(0, 25).map(([k, v]) => k + ' x' + v).join(' | '); }
if (q.get('roof')) { const out = []; let n = 0; for (const f of hg.foot) { if (f.base === undefined || f.h < 6 || n >= 6) continue; let cx = 0, cz = 0; for (const [x, z] of f.ring) { cx += x; cz += z; } cx /= f.ring.length; cz /= f.ring.length; if (!inRingT(cx, cz, f.ring)) continue; const tc = hg.terrAt(cx, cz), want = f.base + f.h - tc; if (Math.abs(f.base - tc) < 1) continue; n++; hg.placeAt(cx, cz, 0); hg.flying = false; hg.y = want + 4; hg.vy = 0; for (let i = 0; i < 90; i++) hg.update(1 / 30, { mx: 0, mz: 0 }, cam); out.push(`h${f.h.toFixed(1)} slope${(tc - f.base).toFixed(1)} want${want.toFixed(2)} got${hg.y.toFixed(2)}`); } document.getElementById('log').textContent = 'roof ' + out.join(' | '); }
function inRingT(x, z, r) { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [xi, zi] = r[i], [xj, zj] = r[j]; if (zi > z !== zj > z && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c; } return c; }
if (q.get('big')) { const t = []; for (const c of hg.chunks.values()) c.scene.traverseVisible((o) => { if (!o.isMesh || o.isInstancedMesh) return; const g = o.geometry, n = (g.index ? g.index.count : g.attributes.position.count) / 3; t.push([n, (o.material?.type || '') + (o.material?.map ? '+map' : '') + (o.material?.color ? o.material.color.getHexString() : '') + (o.material?.vertexColors ? 'VC' : '') + (o.material?.emissive ? 'E' + o.material.emissive.getHexString() : '') + ':' + Object.keys(g.attributes).join(',')]); }); const agg = {}; for (const [n, k] of t) agg[k] = (agg[k] || 0) + n; document.getElementById('log').textContent = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 14).map(([k, v]) => k + ' ' + Math.round(v / 1000) + 'k').join(' | '); }
} catch (e) { document.getElementById('log').textContent = e.stack; }
