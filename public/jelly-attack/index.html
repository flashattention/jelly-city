<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>젤리어택</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/shell.css" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hurt"></div>
  <div id="scope" class="hidden"><div class="ring"></div></div>
  <!-- 싸우는 동안 -->
  <div id="hud" class="hidden">
    <div id="cross"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><b></b></div>
    <div id="hitmark" class="hidden">✕</div>
    <div id="top"><span id="sc-red"></span><span id="timer">6:00</span><span id="sc-blue"></span></div>
    <div id="feed"></div>
    <div id="hp"><b id="hp-n">100</b><div id="hp-bar"><i></i></div></div>
    <div id="ammo"><div id="w-name"></div><b id="ammo-n">30</b><span id="ammo-r">/ 90</span><div id="slots"></div></div>
    <canvas id="radar" width="150" height="150"></canvas>
    <div class="hud-r"><button id="b-mute" title="소리">🔊</button><button id="b-quit" title="나가기">✕</button></div>
    <div id="dirs"></div>
  </div>
  <div id="death" class="hidden"><div id="death-by"></div><div id="death-t"></div><div class="note">B: 무기 바꾸기 (다음 부활부터)</div></div>
  <div id="lockmsg" class="hidden"><div class="card"><div class="logo small">🔫</div><b>화면을 클릭하면 조작을 시작해요</b><div class="note">마우스로 둘러보기 · Esc 로 마우스 풀기</div><div class="row2"><button id="lock-btn" class="btn big">▶ 계속하기</button><button id="loadout-btn" class="btn ghost">🎒 무기 고르기 (B)</button><button id="sens-btn" class="btn ghost">🖱️ 감도</button><button id="quit-btn" class="btn ghost">나가기</button></div></div></div>
  <div id="scoreboard" class="hidden"></div>
  <div id="banner" class="hidden"></div>
  <!-- 무기 고르기 -->
  <div id="loadout" class="screen hidden"><div class="card wide">
    <h2>🎒 무기 고르기</h2>
    <div class="sub">젤리시티의 무기 그대로! 고른 무기는 다음 부활부터 들어요</div>
    <h3>주무기</h3><div id="lo-primary" class="wgrid"></div>
    <h3>보조무기</h3><div id="lo-secondary" class="wgrid"></div>
    <div class="note">🔪 나이프 · 💣 젤리 수류탄(한 번 부활에 1개)은 항상 들고 있어요</div>
    <div class="row2"><button id="lo-ok" class="btn big">확인</button></div>
  </div></div>
  <!-- 결과 -->
  <div id="over" class="screen hidden"><div class="card wide">
    <div id="ov-title"></div><div id="ov-me"></div>
    <div id="ov-rank" class="board"></div>
    <div class="row2"><button id="again-btn" class="btn big">🔁 방으로 돌아가기</button><button id="home-btn" class="btn ghost">처음으로</button></div>
  </div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
