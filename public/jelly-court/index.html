<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>젤리궁정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/shell.css" />
  <link rel="stylesheet" href="../shared/css/party.css" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>
  <!-- 게임 중 -->
  <div id="game" class="hidden">
    <div id="table">
      <div id="felt"></div>
      <div id="center">
        <div class="piles"><div id="deck" class="cback"><b id="deck-n">0</b></div><div id="pile"></div></div>
        <div id="round"></div>
        <div id="banner"></div>
      </div>
      <div id="seats"></div>
      <div id="flyer-layer"></div>
    </div>
    <div id="log" class="panel"></div>
    <div id="mybar">
      <div id="myrole" class="panel"></div>
      <div id="hand"></div>
      <div id="actions"><div id="timer"><i></i></div><button id="end-btn" class="btn alt">⏭️ 차례 끝</button></div>
    </div>
    <div id="aim" class="hidden"><span id="aim-txt"></span><button id="aim-x" class="btn ghost mini">취소</button></div>
    <div class="hud-r"><button id="b-rules" title="규칙">📖</button><button id="b-mute" title="소리 (M)">🔊</button><button id="b-quit" title="그만하기">✕</button></div>
  </div>
  <!-- 막기 물어보기 -->
  <div id="react" class="hidden"><div class="card"><div id="react-txt"></div><div class="rbar"><i id="react-bar"></i></div><div class="row2"><button id="r-yes" class="btn big alt">🫧 막기!</button><button id="r-no" class="btn ghost">그냥 맞기</button></div></div></div>
  <!-- 규칙 -->
  <div id="rules" class="screen hidden"><div class="card wide rules-card">
    <h2>📖 젤리궁정 규칙</h2>
    <div id="rules-body"></div>
    <div class="row2"><button id="rules-x" class="btn">알겠어요!</button></div>
  </div></div>
  <div id="count" class="overlay hidden"><div class="count-big" id="count-n">3</div></div>
  <!-- 결과 -->
  <div id="over" class="screen hidden"><div class="card wide">
    <h2 id="ov-title">끝!</h2>
    <div id="ov-me" class="sub"></div>
    <div id="ov-rank" class="res-list"></div>
    <div class="row2"><button id="again-btn" class="btn big">🔁 한 판 더</button><button id="home-btn" class="btn ghost">처음으로</button></div>
  </div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
