<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>젤리 땡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/shell.css" />
  <link rel="stylesheet" href="../shared/css/party.css" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>
  <!-- 게임 중 -->
  <div id="game" class="hidden">
    <div id="topbar"><div id="clock" class="panel">⏱️ <b id="clock-t">3:00</b></div></div>
    <div id="target" class="panel"><small>한 가지 맛이 딱</small><b id="target-n">5</b><small>마리면 땡!</small></div>
    <div id="banner" class="hidden"></div>
    <div id="table">
      <div id="felt"></div>
      <div id="seats"></div>
      <div id="center">
        <button id="bell" aria-label="종 치기 (Space)"><span class="bell-top"></span><span class="bell-body"><b id="bell-n">5</b></span><span class="bell-base"></span><em>Space</em></button>
      </div>
    </div>
    <div id="pads">
      <button id="flip-btn" class="pad flip">🃏 뒤집기<small>F · ↓</small></button>
      <button id="ring-btn" class="pad ring">🔔 땡!<small>Space · J</small></button>
    </div>
    <div class="hud-r"><button id="b-help" title="규칙">❔</button><button id="b-mute" title="소리 (M)">🔊</button><button id="b-quit" title="그만하기">✕</button></div>
  </div>
  <div id="count" class="overlay hidden"><div class="count-big" id="count-n">3</div></div>
  <!-- 규칙 -->
  <div id="rules-screen" class="screen hidden"><div class="card wide">
    <h2>📖 젤리 땡 규칙</h2>
    <div id="rules-body" class="rules"></div>
    <div class="row2"><button id="rules-back" class="btn big">알겠어요!</button></div>
  </div></div>
  <!-- 결과 -->
  <div id="over" class="screen hidden"><div class="card wide">
    <h2 id="ov-title">🔔 끝!</h2>
    <div id="ov-me" class="sub"></div>
    <div id="ov-rank" class="res-list"></div>
    <div class="row2"><button id="again-btn" class="btn big">🔁 한 판 더</button><button id="home-btn" class="btn ghost">처음으로</button></div>
  </div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
