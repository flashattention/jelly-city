<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>젤리드롭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/shell.css" />
  <link rel="stylesheet" href="../jelly-tactical/style.css" />
  <link rel="stylesheet" href="bg.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hurt"></div>
  <div id="zone-tint"></div>
  <div id="flashw"></div>
  <div id="knock" class="hidden"><b>💫 기절!</b><span>동료가 F 를 누르고 있으면 살아나요 · 기어서 숨어요</span><div class="kb"><i id="knock-bar"></i></div></div>
  <div id="scope" class="hidden"><div class="ring"></div></div>
  <div id="reddot" class="hidden"><i></i></div>
  <div id="hud" class="hidden">
    <div id="cross"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><b></b></div>
    <div id="hitmark" class="hidden">✕</div>
    <div id="bg-top"><span id="alive">🪂 0</span><span id="kills">🎯 0</span><span id="zone-txt"></span></div>
    <div id="feed"></div>
    <canvas id="mini" width="220" height="220"></canvas>
    <div id="hp"><div id="gear"></div><b id="hp-n">100</b><div id="hp-bar"><i></i></div><div class="boostbar hidden" title="부스트: 조금씩 회복 · 60 넘으면 빨라져요"><i id="boost"></i></div></div>
    <div id="heals"></div>
    <div id="stance" class="hidden"></div>
    <div id="squad" class="hidden"></div>
    <div id="rev" class="hidden"><span id="rev-txt"></span><div class="pbar2"><i id="rev-bar"></i></div></div>
    <div id="ammo"><div id="w-name"></div><b id="ammo-n"></b><span id="ammo-r"></span><div id="bg-slots"></div></div>
    <div id="prompt" class="hidden"></div>
    <div id="heal-bar" class="hidden"><div id="heal-txt"></div><div class="pbar2"><i></i></div></div>
    <div id="phase-tip" class="hidden"></div>
    <div class="hud-r"><button id="b-mute" title="소리">🔊</button><button id="b-quit" title="나가기">✕</button></div>
    <div id="dirs"></div>
  </div>
  <div id="inv" class="hidden"><div class="inv-card"><div class="inv-head"><b>🎒 가방</b><span>Tab · Esc 닫기 · 걸으면서 정리해요 · 버리기 · 부착물 빼기 (X: 가방 안 열고 든 것 버리기)</span><button id="inv-close">✕</button></div><div class="inv-body"></div></div></div>
  <div id="bigmap" class="hidden"><canvas id="big" width="720" height="720"></canvas><div class="note">M 으로 닫기</div></div>
  <div id="spec" class="hidden"><div id="spec-place"></div><div id="spec-who"></div><div class="note">Space · 클릭: 다른 사람 보기 · ✕ 나가기</div></div>
  <div id="lockmsg" class="hidden"><div class="card"><div class="logo small">🪂</div><b>화면을 클릭하면 조작을 시작해요</b><div class="note">마우스로 둘러보기 · Esc 로 마우스 풀기</div><div class="row2"><button id="lock-btn" class="btn big">▶ 계속하기</button><button id="sens-btn" class="btn ghost">🖱️ 감도</button><button id="fs-btn" class="btn ghost" title="전체화면이면 Ctrl(앉기)+W 를 눌러도 탭이 닫히지 않아요">⛶ 전체화면</button><button id="quit-btn" class="btn ghost">나가기</button></div></div></div>
  <div id="banner" class="hidden"></div>
  <div id="over" class="screen hidden"><div class="card wide">
    <div id="ov-title"></div><div id="ov-me"></div>
    <div id="ov-rank" class="board"></div>
    <div class="row2"><button id="again-btn" class="btn big">🔁 한 판 더</button><button id="home-btn" class="btn ghost">처음으로</button></div>
  </div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
